name: launch-script-validation

on:
  push:
    branches: [main, master]
    paths:
      - "launch_train_ae_classifier_holdout_experiments.sh"
      - "launch_train_ae_then_classifier_holdout_experiments.sh"
      - "tests/integration/test_launch_experiment_scripts.py"
      - "bernn/dl/train/train_ae_classifier_holdout.py"
      - "bernn/dl/train/train_ae_then_classifier_holdout.py"
      - ".github/workflows/launch-script-validation.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "launch_train_ae_classifier_holdout_experiments.sh"
      - "launch_train_ae_then_classifier_holdout_experiments.sh"
      - "tests/integration/test_launch_experiment_scripts.py"
      - "bernn/dl/train/train_ae_classifier_holdout.py"
      - "bernn/dl/train/train_ae_then_classifier_holdout.py"
      - ".github/workflows/launch-script-validation.yml"
  workflow_dispatch:

jobs:
  launch-script-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run launch script validation tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/integration/test_launch_experiment_scripts.py -q -p no:warnings
